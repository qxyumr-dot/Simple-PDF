name: Build Windows application
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build portable application
        shell: powershell
        run: .\scripts\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Simple-PDF-Windows-x64
          path: dist/Simple-PDF-Windows-x64.zip
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Simple-PDF-Windows-x64
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" Simple-PDF-Windows-x64.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" Simple-PDF-Windows-x64.zip --title "Simple-PDF $GITHUB_REF_NAME" --generate-notes
          fi
