<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f6;color:#203a34;font-family:"Segoe UI","Microsoft YaHei UI",sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:38px}.card{position:relative;text-align:center;max-width:680px;width:100%;background:#fff;border:1px solid #e0e9e5;border-radius:24px;padding:50px 46px 36px;box-shadow:0 16px 60px #193d2e07}.eyebrow{font-size:12px;letter-spacing:3px;color:#6b837a;margin-bottom:30px}.art{width:132px;height:152px;margin:0 auto 30px;display:block}h1{font-size:30px;letter-spacing:1px;font-weight:600;margin:0 0 16px}p{font-size:14px;line-height:1.9;color:#778881;margin:0}.open{border:0;border-radius:9px;padding:14px 30px;font:600 14px "Microsoft YaHei UI",sans-serif;color:#fff;background:#186e5c;cursor:pointer;margin:28px 0 18px;transition:background .2s}.open:hover{background:#105b4b}.open:focus-visible{outline:3px solid #9accb8;outline-offset:4px}.hint{font-size:12px;color:#91a199}.features{border-top:1px solid #edf1ef;margin-top:38px;padding-top:25px;display:flex;justify-content:center;gap:32px;color:#6b7f75;font-size:12px}.features span{display:flex;gap:7px;align-items:center}.dot{height:5px;width:5px;border-radius:50%;background:#76aa92}@media(max-width:650px){.card{padding:32px 22px}h1{font-size:25px}.features{gap:18px}}
